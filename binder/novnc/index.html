<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RViz</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1a1a;
      }
      #screen {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script type="module">
      import RFB from "./core/rfb.js";

      // Connect to the websockify endpoint next to this page. Deriving the
      // websocket URL from window.location keeps this working behind a Jupyter
      // base_url prefix (e.g. BinderHub's /user/<name>/...).
      const base = window.location.pathname.replace(/[^/]*$/, "");
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const url = `${protocol}://${window.location.host}${base}websockify`;

      const rfb = new RFB(document.getElementById("screen"), url);
      rfb.scaleViewport = true;
      rfb.resizeSession = true;
    </script>
  </body>
</html>
